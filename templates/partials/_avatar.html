
{% with size_px=size|default:32 %} {% if user.profile.photo %}
<img
  src="{{ user.profile.photo.url }}"
  alt="{{ user.profile.display_name }}"
  class="rounded-circle"
  style="width: {{ size_px }}px; height: {{ size_px }}px; object-fit: cover"
/>
{% else %}
<span
  class="badge rounded-pill bg-secondary"
  style="width: {{ size_px }}px; height: {{ size_px }}px; display: inline-flex; align-items: center; justify-content: center;{% if size_px >= 96 %} font-size: 2.5rem;{% endif %}"
  >{{ user.get_username|first|upper }}</span
>
{% endif %} {% endwith %}
