{% extends "base.html" %}
{% block title %}Log In — Rocky Mountain Coalition{% endblock title %}
{% block content %}
<section class="container my-5" style="max-width: 480px;">
  <h1 class="section-heading">Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="mt-3">
    New here? <a href="{% url 'signup' %}">Create an account</a>.
  </p>
</section>
{% endblock content %}
